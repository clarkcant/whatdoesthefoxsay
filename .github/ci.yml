name: INTEGRATION
 
on:
  push:
    branches: [ develop ]
 
jobs:
  Backend:
    runs-on: ubuntu-latest
 
    defaults:
      run:
        working-directory: Backend

    services:
      mariadb:
        image: mariadb:12.1.2
        env:
          MARIDB_ROOT_PASWWORD: toor
          MARIADB_DATABASE: test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306


jobs: 
  Frontend:
    steps:
      - name: Cypress E2E Install
        with:
          working directory: frontend

      - name: Install Dep
        run: npm i 

      - name: Cypress E2E Install
        uses: cypress.io/github-action@v6
        with:
          install: false
          start: run npm dev
          working directory: frontend
      
      - name: Generate Coverage repport
        run: npm run cypress:Coverage

      - name: Upload screen repport
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshot
          path: frontend/cypress/screenshots
          retention-days: 1 


      - name: Upload video repport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 1 

      - name: Upload Coverage repport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshot
          path: frontend/cypress/screenshots
          retention-days: 1 
